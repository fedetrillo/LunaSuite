<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>LunaSuite</title>
  <style>
    :root, [data-theme="dark"] {
      --plate: #1d1f23; --panel: #282b31; --well: #141518; --edge: #363a42;
      --text: #ecebe6; --dim: #8e939c; --silk: #b9bdc5;
      --acc: #f2b13c; --ok: #6ad48a; --bad: #ff8a80; --ink: #1b1d21;
      color-scheme: dark;
    }
    [data-theme="grey"] {
      --plate: #4b4f56; --panel: #585d65; --well: #41454b; --edge: #6a6f78;
      --text: #f4f3ef; --dim: #c4c7cc; --silk: #dfe1e5;
      --acc: #ffc45c; --ok: #84e3a2; --bad: #ffb3a8; --ink: #1b2129;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--plate); color: var(--text); font: 13px/1.4 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-font-smoothing: antialiased; transition: background .2s; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    header { display: flex; align-items: center; padding: 10px 12px 4px; gap: 8px; }
    h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 800; }
    h1 small { font-weight: 600; color: var(--dim); font-size: 11px; margin-left: 4px; font-variant-numeric: tabular-nums; }
    .theme { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 7px; padding: 2px; }
    .theme button { width: 24px; height: 20px; border: 0; border-radius: 5px; background: none; display: grid; place-items: center; padding: 0; color: var(--dim); }
    .theme button.on { background: var(--panel); color: var(--text); }
    .theme svg { width: 12px; height: 12px; }
    select, input[type=search] { background: var(--well); border: 1px solid var(--edge); border-radius: 6px; padding: 3px 6px; font-size: 12px; }
    main { flex: 1; overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--panel); border-radius: 10px; padding: 9px 10px; }
    .card h2 { margin: 0 0 6px; font-size: 11px; color: var(--dim); font-weight: 700; }
    #sel b { font-size: 13px; }
    #sel div { color: var(--dim); font-size: 12px; }
    .chain { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
    .link { display: grid; grid-template-columns: 14px 1fr 110px 20px; gap: 6px; align-items: center; background: var(--well); border: 1px solid var(--edge); border-radius: 7px; padding: 4px 6px; }
    .link .n { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
    .link .nm { font-weight: 700; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link select { width: 100%; padding: 2px 4px; font-size: 11px; }
    .link button { border: 0; background: none; color: var(--dim); padding: 0; font-size: 13px; }
    .empty { color: var(--dim); font-size: 12px; padding: 2px 0 4px; }
    .picker { display: grid; grid-template-columns: 1fr auto; gap: 5px; }
    .picker input { width: 100%; }
    #add { border: 1px solid var(--edge); background: var(--well); border-radius: 6px; font-weight: 700; padding: 0 10px; }
    #plugins { grid-column: 1 / -1; width: 100%; height: 118px; }
    .opts { display: grid; grid-template-columns: 64px 1fr; gap: 7px 8px; align-items: center; font-size: 12px; }
    .opts > label { color: var(--dim); font-size: 11.5px; }
    .seg { display: flex; flex-wrap: wrap; gap: 3px; transition: opacity .15s; }
    .seg button { flex: 1 0 auto; min-width: 30px; padding: 3px 5px; border-radius: 6px; border: 1px solid var(--edge); background: var(--well); color: var(--silk); font-weight: 700; font-size: 11.5px; }
    #tail { display: grid; grid-template-columns: repeat(4, 1fr); }
    .seg button.on { background: var(--acc); border-color: var(--acc); color: var(--ink); }
    .check { display: flex; gap: 7px; align-items: center; font-size: 12px; cursor: pointer; }
    .check input { accent-color: var(--acc); margin: 0; }
    .row { display: flex; gap: 6px; }
    .row button { flex: 1; height: 38px; border-radius: 9px; border: 1px solid var(--edge); background: var(--panel); font-weight: 800; }
    #render { background: var(--acc); border-color: var(--acc); color: var(--ink); }
    button:disabled { opacity: .4; cursor: default; }
    .status { text-align: center; font-size: 12px; color: var(--dim); min-height: 1.4em; }
    .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <h1>LunaSuite <small id="ver"></small></h1>
    <div class="theme">
      <button data-t="dark" id="tDark"><svg viewBox="0 0 16 16"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg></button>
      <button data-t="grey" id="tGrey"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
    </div>
    <select id="lang"></select>
  </header>
  <main>
    <section class="card"><h2 id="selLabel"></h2><div id="sel"></div></section>
    <section class="card">
      <h2 id="chainLabel"></h2>
      <div class="chain" id="chain"></div>
      <div class="picker">
        <input type="search" id="search">
        <button id="add"></button>
        <select id="plugins" size="7"></select>
      </div>
    </section>
    <section class="card">
      <div class="opts">
        <label id="tailLabel"></label><div class="seg" id="tail"></div>
        <label id="modLabel"></label><div class="seg" id="mod"></div>
        <label id="destLabel"></label><div class="seg" id="dest"></div>
        <label id="fadeLabel"></label><div class="seg" id="fade"></div>
        <span></span><label class="check"><input type="checkbox" id="keep"><span id="keepLabel"></span></label>
      </div>
    </section>
    <section class="row"><button id="prep"></button></section>
    <section class="row"><button id="listen" disabled></button><button id="render" disabled></button><button id="cancel" disabled></button></section>
    <div class="status" id="status" role="status"></div>
  </main>
  <script src="vendor/luna.global.js"></script>
  <script src="main.js"></script>
</body>
</html>
