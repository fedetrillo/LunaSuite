<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>LunaSuite</title>
  <style>
    :root, [data-theme="dark"] {
      --plate: #141619; --panel: #1d2024; --panel2: #24282d; --well: #101215; --edge: #2c3036;
      --text: #f1f0ec; --dim: #858a93; --silk: #b9bdc5;
      --ok: #3ddc84; --bad: #ff5a6a; color-scheme: dark;
    }
    [data-theme="grey"] {
      --plate: #4a4e55; --panel: #555a62; --panel2: #5d626a; --well: #41454b; --edge: #6a6f78;
      --text: #f6f5f1; --dim: #c9ccd1; --silk: #e1e3e6;
      --ok: #7ef0ae; --bad: #ff9aa3;
    }
    /* The colour the user picks for the add-on */
    [data-color="yellow"] { --acc: #ffd23f; --acc2: #f5a623; --ink: #1f1600; }
    [data-color="orange"] { --acc: #ffa94d; --acc2: #ff6b3d; --ink: #1f0c00; }
    [data-color="red"]    { --acc: #ff6b6b; --acc2: #e0334f; --ink: #1f0508; }
    [data-color="green"]  { --acc: #2ee6a6; --acc2: #9be14a; --ink: #0b1a10; }
    [data-color="blue"]   { --acc: #4cc3ff; --acc2: #5b6cff; --ink: #06131f; }
    [data-color="pink"]   { --acc: #ff86c8; --acc2: #ff4f8b; --ink: #1f0612; }
    [data-color="purple"] { --acc: #c08bff; --acc2: #7b5cff; --ink: #12081f; }
    [data-theme="grey"][data-color="yellow"] { --acc: #ffdc66; --acc2: #ffb648; }
    [data-theme="grey"][data-color="orange"] { --acc: #ffbd73; --acc2: #ff8a63; }
    [data-theme="grey"][data-color="red"]    { --acc: #ff8f8f; --acc2: #ff5c74; }
    [data-theme="grey"][data-color="green"]  { --acc: #5ff0bd; --acc2: #b8ee7a; }
    [data-theme="grey"][data-color="blue"]   { --acc: #7fd4ff; --acc2: #8f9bff; }
    [data-theme="grey"][data-color="pink"]   { --acc: #ffa6d6; --acc2: #ff79a8; }
    [data-theme="grey"][data-color="purple"] { --acc: #d4adff; --acc2: #a08bff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--plate); color: var(--text); font: 12.5px/1.35 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    svg { display: block; }
    .top { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--edge); }
    h1 { flex: 1; white-space: nowrap; margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
    h1 small { font-weight: 600; color: var(--dim); font-size: 10.5px; margin-left: 4px; font-variant-numeric: tabular-nums; }
    .theme { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 2px; }
    .theme button { width: 26px; height: 22px; border: 0; border-radius: 7px; background: none; display: grid; place-items: center; padding: 0; color: var(--dim); }
    .theme button.on { background: var(--panel2); color: var(--text); }
    .theme svg { width: 12px; height: 12px; }
    select { background: var(--well); border: 1px solid var(--edge); border-radius: 8px; padding: 4px 7px; font-size: 12px; font-weight: 700; }
    /* Colour menu */
    .colors { position: relative; }
    #colorBtn { width: 30px; height: 28px; border-radius: 9px; border: 1px solid var(--edge); background: var(--well); display: grid; place-items: center; padding: 0; }
    #colorBtn i, .sw { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, var(--acc), var(--acc2)); display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
    #colorBtn.open { border-color: var(--acc); }
    .menu { position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; width: 150px; padding: 5px; background: var(--panel2); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; }
    .menu[hidden] { display: none; }
    .menu button { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 5px 8px; border-radius: 7px; font-weight: 700; font-size: 12px; text-align: left; }
    .menu button:hover { background: var(--well); }
    .menu button span { flex: 1; }
    .menu button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
    .menu button.on svg { visibility: visible; }
    main { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .card { background: var(--panel); border-radius: 16px; padding: 9px 11px; }
    .card h2 { margin: 0 0 7px; font-size: 10.5px; color: var(--dim); font-weight: 800; }
    #sel b { font-size: 13px; font-weight: 800; color: var(--acc); }
    #sel div { color: var(--dim); font-size: 12px; margin-top: 2px; }
    #sel .hint { color: var(--silk); font-size: 12.5px; margin: 0; }
    /* Chain */
    .chain { display: flex; flex-direction: column; gap: 4px; margin-bottom: 7px; }
    .link { display: grid; grid-template-columns: 22px 1fr 112px 22px; gap: 7px; align-items: center; background: var(--well); border: 1px solid var(--edge); border-radius: 10px; padding: 4px 6px 4px 4px; }
    .link .n { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-weight: 800; font-size: 11px; color: var(--ink); background: linear-gradient(135deg, var(--acc), var(--acc2)); }
    .link .nm { font-weight: 800; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link select { width: 100%; padding: 2px 5px; font-size: 11px; font-weight: 600; }
    .link button { border: 0; background: none; color: var(--dim); padding: 0; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; }
    .link button:hover { color: var(--bad); background: var(--panel2); }
    .link button svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
    .empty { color: var(--dim); font-size: 12px; padding: 0 0 8px; }
    .picker { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    #search { width: 100%; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 5px 9px; font-size: 12px; outline: none; }
    #search:focus { border-color: var(--acc); }
    .btn { border: 1px solid var(--edge); background: var(--well); border-radius: 9px; padding: 5px 12px; font-weight: 700; font-size: 12px; }
    .btn:hover:not(:disabled) { border-color: var(--silk); }
    button:disabled { opacity: .35; cursor: default; }
    #plugins { grid-column: 1 / -1; height: 118px; overflow-y: auto; background: var(--well); border: 1px solid var(--edge); border-radius: 10px; padding: 4px; display: flex; flex-direction: column; outline: none; }
    #plugins:focus-visible { border-color: var(--acc); outline: none; }
    .ghead { color: var(--dim); font-size: 10.5px; font-weight: 800; padding: 5px 8px 2px; }
    .grp { display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 5px 8px; border-radius: 7px; font-weight: 800; font-size: 12px; text-align: left; color: var(--silk); flex: none; }
    .grp:hover { background: var(--panel); color: var(--text); }
    .grp svg { width: 10px; height: 10px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
    .grp.open svg { transform: rotate(90deg); }
    .grp span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grp em { font-style: normal; font-size: 10.5px; color: var(--dim); background: var(--panel); border-radius: 999px; padding: 0 7px; }
    .grp.has span { color: var(--acc); }
    .item.sub { padding-left: 25px; }
    .item { border: 0; background: none; text-align: left; padding: 4px 8px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
    .item em { font-style: normal; color: var(--dim); font-weight: 600; }
    .item:hover { background: var(--panel); }
    .item.on { background: linear-gradient(90deg, color-mix(in srgb, var(--acc) 38%, transparent), transparent); font-weight: 800; }
    /* Options */
    .opts { display: grid; grid-template-columns: 62px 1fr; gap: 6px 8px; align-items: center; }
    .opts > label { color: var(--dim); font-size: 11px; font-weight: 700; }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 2px; gap: 2px; transition: opacity .15s; }
    #tail { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); }
    .seg button { border: 0; background: none; border-radius: 7px; padding: 3px 4px; font-size: 11.5px; font-weight: 700; color: var(--dim); white-space: nowrap; }
    .seg button:hover { color: var(--text); }
    .seg button.on { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: var(--ink); font-weight: 800; }
    .seg.off { opacity: .4; }
    .check { display: flex; gap: 8px; align-items: center; font-size: 12px; cursor: pointer; color: var(--silk); }
    .check input { accent-color: var(--acc2); margin: 0; width: 14px; height: 14px; }
    /* Actions */
    .row { display: flex; gap: 6px; }
    .row button { flex: 1; height: 36px; border-radius: 11px; border: 1px solid var(--edge); background: var(--panel); font-weight: 800; font-size: 12.5px; }
    .row button:hover:not(:disabled) { border-color: var(--silk); }
    .row button.main { background: linear-gradient(90deg, var(--acc), var(--acc2)); border: 0; color: var(--ink); }
    .foot { padding: 8px 12px; border-top: 1px solid var(--edge); min-height: 33px; }
    .status { font-size: 12px; color: var(--dim); text-align: center; }
    .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    #help { padding: 0; width: 28px; min-width: 28px; }
    #help b { background: none; width: auto; height: auto; font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="top">
    <h1>LunaSuite <small id="ver"></small></h1>
    <button id="help"></button>
    <div class="colors">
      <button id="colorBtn" aria-haspopup="true"><i></i></button>
      <div class="menu" id="colorMenu" hidden></div>
    </div>
    <div class="theme">
      <button data-t="dark" id="tDark"><svg viewBox="0 0 16 16"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg></button>
      <button data-t="grey" id="tGrey"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
    </div>
    <select id="lang"></select>
  </div>
  <main>
    <section class="card"><h2 id="selLabel"></h2><div id="sel"></div></section>
    <section class="card">
      <h2 id="chainLabel"></h2>
      <div class="chain" id="chain"></div>
      <div class="picker">
        <input type="search" id="search" spellcheck="false" autocomplete="off">
        <button class="btn" id="add"></button>
        <div id="plugins" tabindex="0" role="listbox"></div>
      </div>
    </section>
    <section class="card">
      <div class="opts">
        <label id="tailLabel"></label><div class="seg" id="tail"></div>
        <label id="modLabel"></label><div class="seg" id="mod"></div>
        <label id="destLabel"></label><div class="seg" id="dest"></div>
        <label id="fadeLabel"></label><div class="seg" id="fade"></div>
        <span></span><label class="check"><input type="checkbox" id="keep"><span id="keepLabel"></span></label>
      </div>
    </section>
    <section class="row"><button id="prep" class="main"></button></section>
    <section class="row"><button id="listen" disabled></button><button id="render" class="main" disabled></button><button id="cancel" disabled></button></section>
  </main>
  <div class="foot"><div class="status" id="status" role="status"></div></div>
  <script src="vendor/luna.global.js"></script>
  <script src="copy.js"></script>
  <script src="winfit.js"></script>
  <script src="tour.js"></script>
  <script src="main.js"></script>
</body>
</html>
